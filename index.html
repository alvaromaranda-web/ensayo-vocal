<html lang="en">
<head>

<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one-screen phone app. A night-stage look: deep ink, brass light, one soft spotlight per screen.
   Tabs above a frosted bottom bar; sheets slide up; the singing stage is full screen. */
:root{
  --bg:#0f0e13; --bg2:#17151d; --surface:#1d1b24; --surface2:#26232f; --line:#302c3a;
  --ink:#f3efe6; --muted:#9b9488; --brass:#d9aa55; --brass2:#f0cf8a; --brass-ink:#1a1408;
  --glow:rgba(217,170,85,.22);
  --good:#45d29a; --warn:#f2bd4b; --sharp:#ff6f55; --flat:#5aa2ff;
  --pill:#f3efe6; --pill-ink:#15131a; --grid:rgba(243,239,230,.06); --gridStrong:rgba(243,239,230,.11);
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --f-display:"DM Serif Display", "Didot", Georgia, serif;
  --f-body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7f3ec; --bg2:#efe9df; --surface:#ffffff; --surface2:#f3eee5; --line:#e4dccd;
  --ink:#1a1720; --muted:#7a7266; --brass:#a87a26; --brass2:#c99a45; --brass-ink:#fffaf0;
  --glow:rgba(168,122,38,.16);
  --good:#178a5c; --warn:#b98316; --sharp:#d64a2f; --flat:#2465c4;
  --pill:#1a1720; --pill-ink:#ffffff; --grid:rgba(26,23,32,.05); --gridStrong:rgba(26,23,32,.1);
  --shadow:0 14px 34px rgba(60,40,10,.12); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f7f3ec; --bg2:#efe9df; --surface:#ffffff; --surface2:#f3eee5; --line:#e4dccd;
  --ink:#1a1720; --muted:#7a7266; --brass:#a87a26; --brass2:#c99a45; --brass-ink:#fffaf0;
  --glow:rgba(168,122,38,.16);
  --good:#178a5c; --warn:#b98316; --sharp:#d64a2f; --flat:#2465c4;
  --pill:#1a1720; --pill-ink:#ffffff; --grid:rgba(26,23,32,.05); --gridStrong:rgba(26,23,32,.1);
  --shadow:0 14px 34px rgba(60,40,10,.12); color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%),var(--bg)}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--brass)}
h2{font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--muted)}
.sub{color:var(--muted);margin:8px 0 0;line-height:1.5}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.press{transition:transform .12s ease, background .2s ease}
.press:active{transform:scale(.97)}
/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--brass)}
.tabs button[aria-selected="true"] svg{filter:drop-shadow(0 0 8px var(--glow))}
.tabs svg{width:22px;height:22px}
/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.date{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.ring{width:64px;height:64px;flex:none}
/* hero */
.hero{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--brass) 35%,var(--line));border-radius:26px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:14px;background:radial-gradient(90% 120% at 85% 0%,color-mix(in srgb,var(--brass) 26%,transparent),transparent 60%),linear-gradient(160deg,var(--surface2),var(--surface));box-shadow:var(--shadow)}
.hero .k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.hero .t{font-family:var(--f-display);font-size:32px;line-height:1.05}
.hero .g{color:var(--muted);line-height:1.5;max-width:34ch}
.hero canvas{position:absolute;right:-6px;bottom:8px;width:52%;height:90px;opacity:.9;pointer-events:none}
.hero .go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--brass);color:var(--brass-ink);font-weight:800;border-radius:99px;padding:10px 16px;font-size:14px;position:relative}
/* lists & cards */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%}
.item .n{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:1.5px solid var(--line);color:var(--muted)}
.item .n.done{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);font-size:20px}
.chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(170deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .thumb{height:70px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb canvas{width:100%;height:100%}
.card .t{font-weight:700;line-height:1.25}
.card .m{font-size:12px;color:var(--muted);margin-top:2px}
.catrow{display:flex;align-items:center;gap:10px}
.catrow .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--brass)}
.btn{border:0;border-radius:18px;padding:16px 18px;font-weight:800;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.brass{background:linear-gradient(180deg,var(--brass2),var(--brass));color:var(--brass-ink);box-shadow:0 10px 30px var(--glow)}
.btn:disabled{opacity:.45}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);line-height:1.55}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.err{background:color-mix(in srgb,var(--sharp) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--sharp) 40%,var(--line));border-radius:16px;padding:14px 16px;line-height:1.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;padding:8px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.x{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.prev{position:relative;background:radial-gradient(80% 90% at 50% 0%,var(--glow),transparent 70%),var(--surface);border:1px solid var(--line);border-radius:26px;padding:14px}
.prev canvas{width:100%;height:170px;display:block}
.ctrls{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl .lbl{font-weight:700}
.ctl .lbl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:14px;padding:3px}
.step button{width:38px;height:38px;border-radius:11px;border:0;background:transparent;font-weight:800;font-size:18px}
.step button:active{background:var(--surface2)}
.step output{min-width:58px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:150px;accent-color:var(--brass)}
select{font:inherit;font-weight:700;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw:checked{background:var(--brass);border-color:var(--brass)}
.sw:checked::after{transform:translateX(20px);background:var(--brass-ink)}
.howto{display:grid;grid-template-columns:1fr;gap:14px;line-height:1.55}
.howto p{margin:6px 0 0}
.sticky{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}
/* stage */
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(70% 45% at 32% 50%,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.meter{flex:1;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px 12px;border-radius:22px;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.meter .top{display:flex;align-items:baseline;gap:8px}
.meter .big{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.meter .msg{font-size:13px;font-weight:800}
.meter .tgt{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.track{position:relative;width:100%;height:10px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--flat) 55%,transparent),color-mix(in srgb,var(--flat) 12%,transparent) 40%,color-mix(in srgb,var(--sharp) 12%,transparent) 60%,color-mix(in srgb,var(--sharp) 55%,transparent))}
.track .zone{position:absolute;top:-3px;bottom:-3px;border-radius:99px;background:color-mix(in srgb,var(--good) 35%,transparent);border:1px solid var(--good)}
.track .needle{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 14px var(--ink);transition:left .06s linear,background .1s}
.track .ends{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--muted)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:120px;pointer-events:none;color:var(--brass);text-shadow:0 0 40px var(--glow)}
.progress{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(60%,260px);height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--brass)}
/* results */
.score{font-family:var(--f-display);font-size:96px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;font-weight:700}
.bars{display:flex;align-items:center;gap:3px;height:130px;position:relative;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat;overflow-x:auto}
.bars .b{flex:1 0 10px;height:100%;position:relative}
.bars .b i{display:block;width:100%;border-radius:5px;position:absolute;left:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.spark{width:100%;height:110px;display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <main class="view" id="view"></main>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Today</button>
    <button role="tab" data-tab="exercises" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 17h3M8.5 13.5h3M13 10h3M17.5 6.5h3"/></svg>Exercises</button>
    <button role="tab" data-tab="melodies" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V5.2l11-2.2v12.3a3 3 0 1 1-2-2.8V7.2l-7 1.4v8.9a3 3 0 1 1-2-2.8z"/></svg>Melodies</button>
    <button role="tab" data-tab="progress" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 8-9"/><path d="M15 7h6v6"/></svg>Progress</button>
  </nav>
</div>

<script>
"use strict";
const APP_VERSION="1.6 · sing-along";
/* ---------- music helpers ---------- */
const NAMES=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const nn=m=>NAMES[((Math.round(m)%12)+12)%12]+(Math.floor(Math.round(m)/12)-1);
const hz2m=(f,a4)=>69+12*Math.log2(f/a4);
const m2hz=(m,a4)=>a4*Math.pow(2,(m-69)/12);
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fitCanvas(cv){if(!cv.isConnected)return {g:cv.getContext("2d"),W:0,H:0};const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return {g,W:r.width,H:r.height};}
function rr(g,x,y,w,h,r){r=Math.min(r,h/2,w/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- settings (per device) ---------- */
const DEF={low:48,high:63,a4:440,tol:25,guide:0.55,octaveFree:false,record:false};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem("ensayo.settings")||"{}"));}catch(e){}
const saveS=()=>{try{localStorage.setItem("ensayo.settings",JSON.stringify(S));}catch(e){}};

/* ---------- exercise library (baritone defaults, transposable) ---------- */
const SOL=["Do","Re","Mi","Fa","So","La","Ti","Do"];
function seq(degs,syl,beats=1){return degs.map((d,i)=>({d,b:Array.isArray(beats)?beats[i]:beats,l:Array.isArray(syl)?syl[i%syl.length]:syl}));}
const EX=[
 {id:"hiss",cat:"Breathing",name:"Sustained Hiss",kind:"breath",secs:20,goal:"Build steady breath support.",how:"Breathe in low through your nose, belly and lower ribs expanding. Hiss out on “sss” as evenly as you can. Keep the ring green until it closes."},
 {id:"holds",cat:"Steadiness",name:"Chorus Holds",root:57,bpm:72,reps:1,notes:[...seq([0],"Ah",4),{rest:1},...seq([2],"Ah",4),{rest:1},...seq([4],"Ah",4),{rest:1},...seq([5],"Ah",4)],goal:"Hold the notes your choruses peak on without sagging.",how:"Sing a relaxed “ah”. Land each note, then keep it level for four beats. Watch the needle and correct early."},
 {id:"major",cat:"Scales",name:"Major Scale Ascending",root:48,bpm:84,reps:2,notes:seq([0,2,4,5,7,9,11,12],SOL,[1,1,1,1,1,1,1,3]),goal:"Lock in the steps of the major scale.",how:"Sing on solfège (Do Re Mi) or one vowel. Each round moves up a half step."},
 {id:"five",cat:"Articulation",name:"Mah Meh Mee Moh Moo",root:50,bpm:88,reps:3,notes:seq([0,2,4,5,7,5,4,2,0],["Mah","Meh","Mee","Moh","Moo","Moh","Mee","Meh","Mah"],[1,1,1,1,2,1,1,1,3]),goal:"Clear vowels with one steady placement.",how:"One breath per pattern. Keep each vowel pure and the pitch centred."},

  const reps=src.reps||1;
